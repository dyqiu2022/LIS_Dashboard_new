services:
  api:
    build:
      context: ./backend
    environment:
      LIS_DATA_DIR: /data
      LIS_MODEL_DIR: /models
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      LIS_EMBEDDING_MODEL: ${LIS_EMBEDDING_MODEL:-codefuse-ai/F2LLM-v2-4B}
      LIS_EMBEDDING_DIM: ${LIS_EMBEDDING_DIM:-1024}
      LIS_EMBEDDING_BATCH_SIZE: ${LIS_EMBEDDING_BATCH_SIZE:-32}
      LIS_EMBEDDING_DTYPE: ${LIS_EMBEDDING_DTYPE:-auto}
      LIS_EMBEDDING_INSTRUCTION: ${LIS_EMBEDDING_INSTRUCTION:-对临床诊断进行分类，生成适合聚类且有代表性的词向量}
      LIS_MODEL_LOCAL_ONLY: ${LIS_MODEL_LOCAL_ONLY:-0}
      LIS_ALLOW_ORIGINS: http://localhost:8080
      LIS_REDIS_URL: redis://redis:6379/0
      LIS_EMBEDDING_DEVICE: auto
      LIS_LOCAL_JOBS: "0"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - lis_data:/data
      - lis_models:/models
    expose:
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - lis_redis:/data
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      LIS_DATA_DIR: /data
      LIS_MODEL_DIR: /models
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      LIS_EMBEDDING_MODEL: ${LIS_EMBEDDING_MODEL:-codefuse-ai/F2LLM-v2-4B}
      LIS_EMBEDDING_DIM: ${LIS_EMBEDDING_DIM:-1024}
      LIS_EMBEDDING_BATCH_SIZE: ${LIS_EMBEDDING_BATCH_SIZE:-32}
      LIS_EMBEDDING_DTYPE: ${LIS_EMBEDDING_DTYPE:-auto}
      LIS_EMBEDDING_INSTRUCTION: ${LIS_EMBEDDING_INSTRUCTION:-对临床诊断进行分类，生成适合聚类且有代表性的词向量}
      LIS_MODEL_LOCAL_ONLY: ${LIS_MODEL_LOCAL_ONLY:-0}
      LIS_REDIS_URL: redis://redis:6379/0
      LIS_EMBEDDING_DEVICE: auto
      LIS_LOCAL_JOBS: "0"
    volumes:
      - lis_data:/data
      - lis_models:/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lis_data:
  lis_models:
  lis_redis:
