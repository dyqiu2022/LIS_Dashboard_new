# Rancher Desktop 专用部署文件。
# 使用独立的 Compose project、网络、镜像名和 volume，避免干扰现有 lis_dashboard_new 集群。
name: lis_dashboard_rancher

services:
  api:
    image: lis-dashboard-rancher-api:local
    build:
      context: ./backend
    environment:
      LIS_DATA_DIR: /data
      LIS_MODEL_DIR: /models
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      LIS_EMBEDDING_MODEL: ${LIS_EMBEDDING_MODEL:-codefuse-ai/F2LLM-v2-4B}
      LIS_EMBEDDING_DIM: ${LIS_EMBEDDING_DIM:-1024}
      LIS_EMBEDDING_BATCH_SIZE: ${LIS_EMBEDDING_BATCH_SIZE:-32}
      LIS_EMBEDDING_DTYPE: ${LIS_EMBEDDING_DTYPE:-auto}
      LIS_EMBEDDING_INSTRUCTION: ${LIS_EMBEDDING_INSTRUCTION:-对临床诊断进行分类，生成适合聚类且有代表性的词向量}
      LIS_MODEL_LOCAL_ONLY: "1"
      LIS_ALLOW_ORIGINS: "http://localhost:${LIS_RANCHER_WEB_PORT:-18080},http://127.0.0.1:${LIS_RANCHER_WEB_PORT:-18080}"
      LIS_REDIS_URL: redis://redis:6379/0
      LIS_EMBEDDING_DEVICE: auto
      LIS_LOCAL_JOBS: "0"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - lis_dashboard_rancher_data:/data
      - type: bind
        source: "${LIS_MODEL_HOST_DIR:-C:/LIS_Dashboard/models}"
        target: /models
    expose:
      - "8000"
    ports:
      - "${LIS_RANCHER_API_PORT:-18000}:8000"
    networks:
      - lis_dashboard_rancher_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    image: lis-dashboard-rancher-web:local
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    ports:
      - "${LIS_RANCHER_WEB_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lis_dashboard_rancher_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - lis_dashboard_rancher_redis:/data
    networks:
      - lis_dashboard_rancher_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: lis-dashboard-rancher-api:local
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      LIS_DATA_DIR: /data
      LIS_MODEL_DIR: /models
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      LIS_EMBEDDING_MODEL: ${LIS_EMBEDDING_MODEL:-codefuse-ai/F2LLM-v2-4B}
      LIS_EMBEDDING_DIM: ${LIS_EMBEDDING_DIM:-1024}
      LIS_EMBEDDING_BATCH_SIZE: ${LIS_EMBEDDING_BATCH_SIZE:-32}
      LIS_EMBEDDING_DTYPE: ${LIS_EMBEDDING_DTYPE:-auto}
      LIS_EMBEDDING_INSTRUCTION: ${LIS_EMBEDDING_INSTRUCTION:-对临床诊断进行分类，生成适合聚类且有代表性的词向量}
      LIS_MODEL_LOCAL_ONLY: "1"
      LIS_REDIS_URL: redis://redis:6379/0
      LIS_EMBEDDING_DEVICE: auto
      LIS_LOCAL_JOBS: "0"
    volumes:
      - lis_dashboard_rancher_data:/data
      - type: bind
        source: "${LIS_MODEL_HOST_DIR:-C:/LIS_Dashboard/models}"
        target: /models
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lis_dashboard_rancher_net
    restart: unless-stopped

volumes:
  lis_dashboard_rancher_data:
    name: lis_dashboard_rancher_data
  lis_dashboard_rancher_redis:
    name: lis_dashboard_rancher_redis

networks:
  lis_dashboard_rancher_net:
    name: lis_dashboard_rancher_net
    driver: bridge
